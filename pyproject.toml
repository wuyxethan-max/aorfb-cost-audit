[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aorfb-cost-audit"
version = "1.0.0"
description = "Techno-economic benchmarking and cycling-protocol sensitivity audit for aqueous organic redox flow batteries (AORFBs)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Yixi (Ethan) Wu"}
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "plotly>=5.22,<7",
    "streamlit>=1.36,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ipython>=8.18,<10", "jupyterlab>=4.2,<5"]

[tool.setuptools.packages.find]
include = ["aorfb_audit*"]

[tool.pytest.ini_options]
pythonpath = ["."]
